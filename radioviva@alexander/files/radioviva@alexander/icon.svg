<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14805e"/>
      <stop offset="50%" stop-color="#0b5e43"/>
      <stop offset="100%" stop-color="#063d2b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed136"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Wave Arcs (Broadcasting) -->
  <path d="M 36 52 A 40 40 0 0 1 92 52" fill="none" stroke="url(#waveGrad)" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 44 60 A 28 28 0 0 1 84 60" fill="none" stroke="url(#waveGrad)" stroke-width="5.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 52 68 A 16 16 0 0 1 76 68" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Center Transmitter Beacon -->
  <circle cx="64" cy="74" r="8" fill="url(#accentGrad)" filter="url(#shadow)"/>
  <circle cx="64" cy="74" r="3.5" fill="#ffffff"/>

  <!-- Radio Antenna Tower Legs -->
  <path d="M 64 82 L 48 106 M 64 82 L 80 106" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 54 96 L 74 96" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Sound Equalizer Mini Indicator -->
  <rect x="24" y="98" width="4" height="12" rx="2" fill="url(#accentGrad)"/>
  <rect x="32" y="92" width="4" height="18" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect x="92" y="92" width="4" height="18" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect x="100" y="98" width="4" height="12" rx="2" fill="url(#accentGrad)"/>
</svg>
