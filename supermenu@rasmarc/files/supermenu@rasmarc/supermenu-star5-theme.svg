<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" color="#2e2e2e"><title>SuperMenu – Stern 5, farbig, S mit Themenfarbe</title><desc>Farbige SVG-Vorlage für SuperMenu. Nur das S mit id=supermenu-s verwendet fill=currentColor. Sternfüllung #ffd43b und Rand #a06b00 bleiben fest. Vorgabefarbe des S ohne Applet-Unterstützung: #2e2e2e. Das Applet setzt beim Darstellen die color-Eigenschaft des SVG-Wurzelelements in einer Kopie der SVG-Daten auf die tatsächliche Themenfarbe. Als farbiges Icon laden. Gewählte S-Endstücke, sämtliche Konturen, Größen, Positionen und Randstärke unverändert.</desc><defs><clipPath id="shape"><path d="M24.590530071 28.703239159 C22.969161715 29.871689399 17.949814489 24.769748402 15.951316001 24.761499177 C13.952022158 24.753235644 8.888674421 29.813216353 7.275769957 28.63179726 C5.663476347 27.45085441 8.964660122 21.100598453 8.354924293 19.197356271 C7.744952185 17.293383601 1.367963489 14.041454941 1.99313968 12.142416383 C2.618070857 10.244112319 9.67764236 11.421363284 11.299307334 10.253350049 C12.921617178 9.084871046 14.043786406 2.015105998 16.043075895 2.022846385 C18.041569332 2.030488761 19.103460135 9.108423533 20.71544334 10.289787512 C22.328058152 11.471606634 29.398561869 10.354173891 30.009034978 12.257995901 C30.619250707 14.16106667 24.215952551 17.358161591 23.590538686 19.256302254 C22.964879982 21.155198337 26.212543469 27.534344079 24.590530071 28.703239159 Z" fill-rule="evenodd" clip-rule="evenodd" /></clipPath></defs><g clip-path="url(#shape)"><rect width="32" height="32" fill="#a06b00" /><path d="M24.590530071 28.703239159 C22.969161715 29.871689399 17.949814489 24.769748402 15.951316001 24.761499177 C13.952022158 24.753235644 8.888674421 29.813216353 7.275769957 28.63179726 C5.663476347 27.45085441 8.964660122 21.100598453 8.354924293 19.197356271 C7.744952185 17.293383601 1.367963489 14.041454941 1.99313968 12.142416383 C2.618070857 10.244112319 9.67764236 11.421363284 11.299307334 1