<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Lumendusk</title>
  <!--
    A sun on the horizon: the moment the desktop changes.

    Deliberately not a crescent moon — that is what every other night-light
    applet uses, and Lumendusk is about the transition between day and night
    rather than about night. Sky above the horizon, ground below, and the sun
    half-set across the line.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3A3566"/>
      <stop offset="0.55" stop-color="#8E4B63"/>
      <stop offset="1"    stop-color="#D97742"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD887"/>
      <stop offset="1" stop-color="#F9A94B"/>
    </linearGradient>
    <clipPath id="disc">
      <circle cx="64" cy="64" r="58"/>
    </clipPath>
  </defs>

  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="128" height="80" fill="url(#sky)"/>
    <!-- Sun centred on the horizon, so exactly half of it shows. -->
    <circle cx="64" cy="80" r="26" fill="url(#sun)"/>
    <rect x="0" y="80" width="128" height="48" fill="#1B1C31"/>
    <!-- A single highlight on the horizon, where the light spills. -->
    <rect x="0" y="79" width="128" height="2" fill="#FFC978" opacity="0.55"/>
  </g>

  <!-- Keeps the disc's edge visible on a light background. -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#000000" stroke-opacity="0.18"
          stroke-width="2"/>
</svg>
